# Mantém as prévias do WhatsApp (foto, nome e preço) dos produtos em dia.
#
# A cada 3 horas lê o conteúdo PUBLICADO no Supabase e gera p/<id>.html e
# p/img/<id>.jpg com scripts/gerar-compartilhamento.py. Se algo mudou
# (produto novo, foto nova, preço novo, produto removido), faz commit e o
# GitHub Pages publica sozinho. Também dá para rodar na mão em
# Actions → "Prévias do WhatsApp" → Run workflow.
name: Prévias do WhatsApp

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compartilhamento
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install --disable-pip-version-check pillow==11.0.0

      - name: Gerar páginas de compartilhamento
        run: python scripts/gerar-compartilhamento.py

      - name: Publicar se mudou
        run: |
          if [ -z "$(git status --porcelain p)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p
          git commit -m "Atualiza prévias do WhatsApp dos produtos"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
