<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel · Imports de Luxo</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="../assets/img/favicon-96.png">
    <link rel="stylesheet" href="../assets/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #00CED1;
            --ink: #1A1A1A;
            --paper: #FDFCFB;
        }
        body { font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); }
        .font-serif { font-family: 'Playfair Display', serif; }

        .field-input {
            width: 100%;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
        }
        .field-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(0, 206, 209, .15);
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            border-radius: 8px; font-weight: 600; font-size: 13px; padding: 10px 18px;
            transition: all .15s; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
        }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-primary { background: var(--ink); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #000; }
        .btn-accent { background: var(--gold); color: #fff; }
        .btn-accent:hover:not(:disabled) { background: #00b5b8; }
        .btn-ghost { background: #fff; color: var(--ink); border-color: #E5E7EB; }
        .btn-ghost:hover:not(:disabled) { border-color: #9CA3AF; }
        .btn-danger { background: #fff; color: #DC2626; border-color: #FECACA; }
        .btn-danger:hover:not(:disabled) { background: #FEF2F2; }

        .card { background: #fff; border: 1px solid #F0F0F0; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 10px;
                    font-size: 14px; font-weight: 500; color: #9CA3AF; transition: all .15s; cursor: pointer; }
        .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
        .nav-item.active { background: var(--gold); color: #fff; font-weight: 600; }

        .rt-editor { min-height: 90px; }
        .rt-editor:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(0,206,209,.15); }
        .rt-editor strong { font-weight: 700; }
        .rt-editor ul { list-style: disc; padding-left: 22px; }
        .rt-editor a { color: #0891b2; text-decoration: underline; }

        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade-up { animation: fadeUp .25s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 6px; }
    </style>
</head>
<body class="min-h-screen">

<div id="app"></div>

<!-- Avisos de sucesso/erro -->
<div id="toasts" class="fixed bottom-5 right-5 z-[80] flex flex-col gap-2 items-end"></div>

<!-- Biblioteca do Supabase servida pelo próprio site: o painel abre mesmo se o
     CDN estiver fora do ar ou bloqueado. -->
<script src="lib/supabase.min.js"></script>
<script src="../assets/cms-config.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
